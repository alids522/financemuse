name: financemuse
description: "Finance Tracker — pencatatan keuangan pribadi, budget, forecast, import/export CSV & PDF, dan kontrol AI agent (MCP). Bahasa id-ID, mata uang IDR, zona waktu Asia/Jakarta."
publish_to: "none"
version: 1.0.0+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.0
  go_router: ^17.0.0
  intl: ^0.20.2
  fl_chart: ^1.1.0
  file_picker: ^10.3.0
  csv: ^6.0.0
  pdf: ^3.11.0
  shared_preferences: ^2.5.0
  path_provider: ^2.1.0
  web: ^1.1.0
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
